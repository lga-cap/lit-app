<!--
  app.component.html — Template mínimo (solo puntos de anclaje)

  Toda la creación y configuración de web components se hace desde JS
  en app.component.ts → buildUI().

  Este template solo proporciona:
   - #app: el div raíz donde la shell monta programáticamente toda la UI
   - #notification: el banner de feedback global (lo controla la shell)

  Así demostramos el patrón "consumed from JS, not HTML":
  ningún web component está declarado aquí como tag HTML con bindings.
-->

<!-- Raíz donde buildUI() inserta bbva-header, bbva-tabs y el contenido -->
<div #app></div>

<!--
  Banner de notificación global.
  Lo dejamos fuera del #app porque siempre está presente en el DOM
  (la shell lo hace visible/invisible via clase CSS).
-->
<div #notification class="notification"></div>
